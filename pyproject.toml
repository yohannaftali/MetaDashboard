[project]
name = "metadashboard"
version = "0.2.0"
description = "MetaDashboard: profit calendar for several MT5 accounts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  # Pinned; the desktop extra brings the native window client.
  "flet[desktop]==0.86.4",
  # Windows only; investor (read-only) logins through a terminal used only for monitoring.
  "MetaTrader5>=5.0.45; sys_platform == 'win32'",
]

[project.scripts]
metadashboard = "metadashboard.app:main"
metadashboard-fetch = "metadashboard.core:main"

[project.gui-scripts]
# no console window; used by the shortcuts install.ps1 makes
metadashboard-gui = "metadashboard.app:gui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metadashboard"]
