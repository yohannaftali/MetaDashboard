<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profit Calendar</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7280; --line: #e3e6ea;
    --pos: 22, 163, 74; --neg: 220, 38, 38; --accent: #2563eb; --weekend: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1218; --panel: #171b23; --text: #e6e8ec; --muted: #8b93a1; --line: #262c37;
      --pos: 34, 197, 94; --neg: 248, 81, 73; --accent: #60a5fa; --weekend: #1b2029;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1218; --panel: #171b23; --text: #e6e8ec; --muted: #8b93a1; --line: #262c37;
    --pos: 34, 197, 94; --neg: 248, 81, 73; --accent: #60a5fa; --weekend: #1b2029;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  h1 { font-size: 18px; margin: 0 12px 0 0; }
  .grow { flex: 1; }
  select, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; }
  .seg button.on { background: var(--accent); color: #fff; }
  .nav { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .nav span { min-width: 120px; text-align: center; }
  main { padding: 16px; max-width: 1400px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .card .k { color: var(--muted); font-size: 12px; }
  .card .v { font-size: 20px; font-weight: 650; margin-top: 2px; }
  .pos { color: rgb(var(--pos)); } .neg { color: rgb(var(--neg)); }
  .year { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .mon { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
  .mon:hover { border-color: var(--accent); }
  .mon h3 { display: flex; justify-content: space-between; margin: 0 0 8px; font-size: 14px; }
  .mini { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .mini .h { color: var(--muted); font-size: 10px; text-align: center; }
  .mini .d { aspect-ratio: 1; border-radius: 4px; font-size: 10px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .mini .d.wk { background: var(--weekend); }
  .month { display: grid; grid-template-columns: repeat(7, 1fr) 0.9fr; gap: 6px; }
  .month .h { color: var(--muted); font-size: 12px; text-align: center; padding: 4px 0; }
  .cell { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-height: 92px; padding: 6px 8px; display: flex; flex-direction: column; }
  .cell.wk { background: var(--weekend); }
  .cell.out { opacity: 0.35; }
  .cell .n { color: var(--muted); font-size: 12px; }
  .cell .p { font-size: 18px; font-weight: 650; margin-top: auto; }
  .cell .a, .cell .t { font-size: 12px; color: var(--muted); }
  .cell.week { background: transparent; border-style: dashed; }
  .cell.hot .n, .cell.hot .a, .cell.hot .t { color: inherit; opacity: 0.85; }
  .cell.today, .mini .d.today { outline: 2px solid var(--accent); outline-offset: -2px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 16px; }
  .stale { color: rgb(var(--neg)); }
  .cell, .mon, .card { min-width: 0; }
  [hidden] { display: none !important; }
  .empty { background: var(--panel); border: 1px dashed var(--line); border-radius: 12px; padding: 32px 16px; text-align: center; color: var(--muted); }
  @media (max-width: 720px) {
    header { gap: 8px; padding: 12px 16px; }
    h1 { font-size: 16px; width: 100%; }
    select { max-width: 100%; }
    main { padding: 12px 16px; }
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .card .v { font-size: 16px; overflow-wrap: anywhere; }
    .year { grid-template-columns: minmax(0, 1fr); }
    .month { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
    .month .wkh, .cell.week { display: none; }
    .cell { min-height: 64px; padding: 4px; }
    .cell .p { font-size: 13px; } .cell .a, .cell .t { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Profit Calendar</h1>
  <select id="acc" aria-label="Account"></select>
  <div class="seg" role="group" aria-label="View">
    <button id="vYear">Year</button><button id="vMonth">Month</button>
  </div>
  <div class="nav"><button id="prev" aria-label="Previous">&#8249;</button><span id="period"></span><button id="next" aria-label="Next">&#8250;</button></div>
  <button id="today">Today</button>
  <div class="grow"></div>
  <button id="theme" aria-label="Theme">&#9680;</button>
</header>
<main>
  <div class="cards" id="cards"></div>
  <div id="view"></div>
  <div class="note" id="note"></div>
</main>
<script>
const DATA = /*__DATA__*/null;
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
// amounts of cent accounts are converted to their dollar for the combined view
const RATE = { USC: 0.01, EUC: 0.01, GBX: 0.01 };
const base = c => (RATE[c] ? c.replace(/C$|X$/, '').replace('US', 'USD').replace('EU', 'EUR').replace('GB', 'GBP') : c);
const state = { acc: 'all', view: location.hash === '#year' ? 'year' : 'month', y: new Date().getFullYear(), m: new Date().getMonth() };
const TODAY = (d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`)(new Date());

function days(accKey) {
  // {date: {pl, start, deposit, trades}} in the account currency, or combined in dollars for "all"
  if (accKey !== 'all') return DATA.accounts[accKey].days;
  const out = {};
  for (const a of DATA.accounts) {
    const r = RATE[a.currency] || 1;
    for (const [d, v] of Object.entries(a.days)) {
      const o = out[d] || (out[d] = { pl: 0, start: 0, deposit: 0, trades: 0 });
      o.pl += v.pl * r; o.start += v.start * r; o.deposit += v.deposit * r; o.trades += v.trades;
    }
  }
  return out;
}
function currency(accKey) {
  if (accKey !== 'all') return DATA.accounts[accKey].currency;
  const set = new Set(DATA.accounts.map(a => base(a.currency)));
  return set.size === 1 ? [...set][0] : 'mixed';
}
// period P/L and % against the balance at the start of the period (first active day)
function period(D, from, to) {
  let pl = 0, start = null, up = 0, down = 0, trades = 0;
  for (const d of Object.keys(D).sort()) {
    if (d < from || d > to) continue;
    const v = D[d];
    if (start === null && v.start > 0) start = v.start;
    pl += v.pl; trades += v.trades;
    if (v.pl > 0) up++; else if (v.pl < 0) down++;
  }
  return { pl, pct: start ? pl / start * 100 : null, up, down, trades };
}
const iso = (y, m, d) => `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
const fmtPct = p => p === null || p === undefined ? '' : (p > 0 ? '+' : '') + p.toFixed(2) + '%';
const fmtAmt = (a, c) => (a > 0 ? '+' : '') + a.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + (c && c !== 'mixed' ? ' ' + c : '');
const cls = v => v > 0 ? 'pos' : v < 0 ? 'neg' : '';
function shade(pct, cap) {
  if (!pct) return '';
  const a = Math.min(1, Math.abs(pct) / cap) * 0.75 + 0.12;
  return `background: rgba(var(${pct > 0 ? '--pos' : '--neg'}), ${a.toFixed(2)}); color: ${a > 0.5 ? '#fff' : 'inherit'};`;
}
function dayPct(v) { return v && v.start > 0 ? v.pl / v.start * 100 : null; }

function render() {
  if (!DATA.accounts.length) {
    document.querySelectorAll('#acc, .seg, .nav, #today').forEach(el => el.hidden = true);
    document.getElementById('cards').innerHTML = '';
    document.getElementById('view').innerHTML = '<div class="empty">No account data yet.</div>';
    document.getElementById('note').textContent = '';
    return;
  }
  const D = days(state.acc), cur = currency(state.acc);
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.id === (state.view === 'year' ? 'vYear' : 'vMonth')));
  document.getElementById('period').textContent = state.view === 'year' ? state.y : `${MONTHS[state.m]} ${state.y}`;
  const from = state.view === 'year' ? iso(state.y, 0, 1) : iso(state.y, state.m, 1);
  const to = state.view === 'year' ? iso(state.y, 11, 31) : iso(state.y, state.m, 31);
  const P = period(D, from, to);
  // cards
  const accs = state.acc === 'all' ? DATA.accounts : [DATA.accounts[state.acc]];
  const r = a => (state.acc === 'all' ? RATE[a.currency] || 1 : 1);
  const bal = accs.reduce((s, a) => s + a.balance * r(a), 0), eq = accs.reduce((s, a) => s + a.equity * r(a), 0);
  const money = v => v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + (cur !== 'mixed' ? ' ' + cur : '');
  document.getElementById('cards').innerHTML = [
    ['Balance', money(bal), ''], ['Equity', money(eq), ''],
    [(state.view === 'year' ? 'Year' : 'Month') + ' P/L', fmtAmt(P.pl, cur), cls(P.pl)],
    [(state.view === 'year' ? 'Year' : 'Month') + ' %', fmtPct(P.pct) || '-', cls(P.pl)],
    ['Winning / losing days', `${P.up} / ${P.down}`, ''], ['Closed trades', P.trades, '']
  ].map(([k, v, c]) => `<div class="card"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`).join('');
  const view = document.getElementById('view');
  if (state.view === 'year') {
    const cap = Math.max(1, ...Object.entries(D).filter(([d]) => d >= from && d <= to).map(([, v]) => Math.abs(dayPct(v) || 0)));
    let html = '<div class="year">';
    for (let m = 0; m < 12; m++) {
      const M = period(D, iso(state.y, m, 1), iso(state.y, m, 31));
      html += `<div class="mon" data-m="${m}"><h3><span>${MONTHS[m]}</span><span class="${cls(M.pl)}">${fmtPct(M.pct)}</span></h3><div class="mini">`;
      html += DOW.map(d => `<div class="h">${d[0]}</div>`).join('');
      const first = (new Date(state.y, m, 1).getDay() + 6) % 7, n = new Date(state.y, m + 1, 0).getDate();
      html += '<div></div>'.repeat(first);
      for (let d = 1; d <= n; d++) {
        const k = iso(state.y, m, d), v = D[k], p = dayPct(v), wk = (first + d - 1) % 7 >= 5;
        const tip = v ? `${k}: ${fmtAmt(v.pl, cur)} (${fmtPct(p)})` : k;
        html += `<div class="d ${wk ? 'wk' : ''} ${k === TODAY ? 'today' : ''}" style="${shade(p, cap)}" title="${tip}">${d}</div>`;
      }
      html += '</div></div>';
    }
    view.innerHTML = html + '</div>';
    view.querySelectorAll('.mon').forEach(el => el.onclick = () => { state.m = +el.dataset.m; state.view = 'month'; render(); });
  } else {
    const cap = Math.max(1, ...Object.entries(D).filter(([d]) => d >= from && d <= to).map(([, v]) => Math.abs(dayPct(v) || 0)));
    let html = '<div class="month">' + DOW.map(d => `<div class="h">${d}</div>`).join('') + '<div class="h wkh">Week</div>';
    const first = (new Date(state.y, state.m, 1).getDay() + 6) % 7, n = new Date(state.y, state.m + 1, 0).getDate();
    const start = new Date(state.y, state.m, 1 - first);
    for (let w = 0; w < 6; w++) {
      let wpl = 0, wstart = null;
      for (let i = 0; i < 7; i++) {
        const day = new Date(start); day.setDate(start.getDate() + w * 7 + i);
        const k = iso(day.getFullYear(), day.getMonth(), day.getDate()), v = D[k], p = dayPct(v);
        const inMonth = day.getMonth() === state.m;
        if (v && inMonth) { wpl += v.pl; if (wstart === null && v.start > 0) wstart = v.start; }
        html += `<div class="cell ${i >= 5 ? 'wk' : ''} ${inMonth ? '' : 'out'} ${inMonth && p ? 'hot' : ''} ${k === TODAY ? 'today' : ''}" style="${inMonth ? shade(p, cap) : ''}" title="${v ? `start balance ${v.start.toFixed(2)}${v.deposit ? ', deposit/withdrawal ' + v.deposit.toFixed(2) : ''}` : ''}">
          <div class="n">${day.getDate()}</div>
          ${v && inMonth ? `<div class="p">${fmtPct(p)}</div><div class="a">${fmtAmt(v.pl, cur)}</div><div class="t">${v.trades ? v.trades + ' trade' + (v.trades > 1 ? 's' : '') : ''}</div>` : ''}
        </div>`;
      }
      html += `<div class="cell week"><div class="n">W${w + 1}</div>${wstart ? `<div class="p ${cls(wpl)}">${fmtPct(wpl / wstart * 100)}</div><div class="a">${fmtAmt(wpl, cur)}</div>` : ''}</div>`;
      if (new Date(start.getFullYear(), start.getMonth(), start.getDate() + (w + 1) * 7) > new Date(state.y, state.m, n)) break;
    }
    view.innerHTML = html + '</div>';
  }
  const stale = DATA.accounts.filter(a => a.stale).map(a => a.name);
  document.getElementById('note').innerHTML = `Generated ${DATA.generated}. Daily % = trading P/L (profit + swap + commission) / balance when the day's first trade happens; deposits and withdrawals are not profit. Month / year % = P/L / balance at the start of the period. Server dates.` +
    (state.acc === 'all' && DATA.accounts.length > 1 ? ' All accounts: cent accounts converted to their dollar.' : '') +
    (stale.length ? ` <span class="stale">Last fetch failed, older data shown: ${stale.join(', ')}.</span>` : '');
}

function init() {
  const sel = document.getElementById('acc');
  sel.innerHTML = (DATA.accounts.length > 1 ? '<option value="all">All accounts</option>' : '') +
    DATA.accounts.map((a, i) => `<option value="${i}">${a.name}${a.login ? ' · ' + a.login : ''} (${a.currency})</option>`).join('');
  state.acc = sel.value;
  sel.onchange = () => { state.acc = sel.value; render(); };
  document.getElementById('vYear').onclick = () => { state.view = 'year'; render(); };
  document.getElementById('vMonth').onclick = () => { state.view = 'month'; render(); };
  document.getElementById('prev').onclick = () => { if (state.view === 'year') state.y--; else if (--state.m < 0) { state.m = 11; state.y--; } render(); };
  document.getElementById('next').onclick = () => { if (state.view === 'year') state.y++; else if (++state.m > 11) { state.m = 0; state.y++; } render(); };
  document.getElementById('today').onclick = () => { const t = new Date(); state.y = t.getFullYear(); state.m = t.getMonth(); render(); };
  document.getElementById('theme').onclick = () => {
    const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    r.dataset.theme = dark ? 'light' : 'dark';
  };
  render();
}

init();
</script>
</body>
</html>
